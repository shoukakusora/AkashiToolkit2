apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// 自动版本号：每次 release 构建 versionCode +1、versionName 末位 +1。
// 仅在构建成功（assembleRelease 结束）后才写回 appbuild/version.properties，
// 失败的构建不会消耗版本号；配合固定签名密钥即可覆盖安装（升级安装）。
// 需要固定版本号时加 -PnoVersionBump。
// ---------------------------------------------------------------------------
def versionFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def currentVersionCode = (versionProps.getProperty('versionCode', '202611')).toInteger()
def currentVersionName = versionProps.getProperty('versionName', '0.14.3')

def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def bumpVersion = releaseRequested && !project.hasProperty('noVersionBump')

def appVersionCode = currentVersionCode
def appVersionName = currentVersionName
if (bumpVersion) {
    appVersionCode = currentVersionCode + 1

    // 版本命名规则：MAJOR.MINOR.PATCH
    //   PATCH 为 1..10；到 10 后再进位 -> MINOR+1, PATCH=1
    //   MINOR 为 1..14；MINOR+1 == 15 时向大版本进位 -> MAJOR+1, MINOR=1, PATCH=1
    def parts = currentVersionName.split('\\.')
    int major = parts.length >= 3 ? parts[0].toInteger() : 0
    int minor = parts.length >= 3 ? parts[1].toInteger() : 14
    int patch = parts.length >= 3 ? parts[2].toInteger() : 10

    patch = patch + 1
    if (patch > 10) {
        patch = 1
        minor = minor + 1
        if (minor >= 15) {
            minor = 1
            major = major + 1
        }
    }
    appVersionName = "${major}.${minor}.${patch}"
}
println "[version] build as ${appVersionName} (${appVersionCode})" + (bumpVersion ? " [will bump on success]" : " [fixed]")

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease' && bumpVersion) {
        task.doLast {
            versionFile.text = "versionCode=${appVersionCode}\nversionName=${appVersionName}\n"
            println "[version] persisted ${appVersionName} (${appVersionCode})"
        }
    }
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "moe.kcwiki.akashitoolkit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables.useSupportLibrary = true
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        // AGP 7 no longer generates BuildConfig.FLAVOR when the module has no product flavors;
        // restore the field (always empty) so the 2018 sources keep compiling unchanged.
        buildConfigField "String", "FLAVOR", '""'
    }

    signingConfigs {
        if (rootProject.file('signing.gradle').exists()) {
            sign
        }
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        release {
            if (rootProject.file('signing.gradle').exists()) {
                signingConfig signingConfigs.sign
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        googlePlayRelease {
            if (rootProject.file('signing.gradle').exists()) {
                signingConfig signingConfigs.sign
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.lite'
        }

        debug {
            if (rootProject.file('signing.gradle').exists()) {
                signingConfig signingConfigs.sign
            }
            applicationIdSuffix '.debug'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            String name = "akashi-toolkit-"
            if (variant.buildType.name.startsWith("googlePlay")) {
                name += "googleplay-"
            }
            name += variant.versionCode + ".apk"
            outputFileName = name
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation "com.android.support:appcompat-v7:$supportLibraryVersion"
    implementation "com.android.support:recyclerview-v7:$supportLibraryVersion"
    implementation "com.android.support:design:$supportLibraryVersion"
    implementation "com.android.support:cardview-v7:$supportLibraryVersion"
    implementation "com.android.support:gridlayout-v7:$supportLibraryVersion"
    implementation "com.android.support:customtabs:$supportLibraryVersion"
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation "moe.shizuku.preference:preference:$preferenceLibraryVersion"
    implementation "moe.shizuku.preference:preference-dialog-appcompat:$preferenceLibraryVersion"
    implementation "moe.shizuku.preference:preference-simplemenu:$preferenceLibraryVersion"
    implementation 'com.github.RikkaW:MiniDrawer:v0.0.6'
    implementation 'com.github.chrisbanes:PhotoView:1.3.0'
    implementation 'io.reactivex:rxjava:1.2.3'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'com.github.RikkaW:Markdown:1.0.6'
    implementation 'com.github.rubensousa:gravitysnaphelper:0.1'
    implementation 'moe.shizuku.fontprovider:api:10'
}

// 开源版本：仓库里不放签名文件。需要签名时，在本地创建 signing.gradle（见 README）。
def signingFile = rootProject.file('signing.gradle')
if (signingFile.exists()) {
    apply from: signingFile
}
