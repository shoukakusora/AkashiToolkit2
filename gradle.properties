org.gradle.jvmargs=-Xmx2048m -Duser.language=en -Duser.country=US
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=false
# AGP 7.4.2 was only tested up to compileSdk 33; compileSdk 34 (Android 14) works but
# prints an "unsupported compileSdk" warning. Suppress it instead of upgrading AGP.
android.suppressUnsupportedCompileSdk=34
